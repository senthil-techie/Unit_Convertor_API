<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<!--    <meta charset="UTF-8">-->
    <title>Length Convertor</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="home-wrapper">
    <div class="glass-card">
        <a href="/">Home</a>
        <hr>
        <h2 class="page-title">📏 Length Convertor</h2>
        <form action="/length" method="post">
            value: <input type="number" step="any" name="value" required><br><br>

            From:
            <select name="from">
                <option value="m">Meter</option>
                <option value="km">Kilometer</option>
                <option value="cm">Centimeter</option>
            </select>
            To:
            <select name="to">
                <option value="m">Meter</option>
                <option value="km">Kilometer</option>
                <option value="cm">Centimeter</option>
            </select>

            <br><br>
            <button type="submit">Convert</button>
        </form>

        <h3 th:text="'Result = '+${result}"></h3>

    </div>
</div>

</body>
</html>
